<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Memory Match</title>
    <link rel="stylesheet" href="styles.css?v=20260428-refresh-2" />
  </head>
  <body>
    <main class="game-shell">
      <section class="topbar" aria-label="ゲーム情報">
        <div>
          <p class="eyebrow">Memory Match</p>
          <h1>神経衰弱</h1>
        </div>
        <div class="toolbar" aria-label="ゲーム操作">
          <button class="icon-button sound-button" id="soundButton" type="button" aria-label="音をオン">
            <span aria-hidden="true" id="soundIcon">♪</span>
            <span class="sound-state" id="soundState">OFF</span>
          </button>
          <button class="icon-button" id="pauseButton" type="button" aria-label="一時停止" disabled>
            <span aria-hidden="true" id="pauseIcon">Ⅱ</span>
          </button>
          <button class="icon-button" id="restartButton" type="button" aria-label="リスタート">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </section>

      <section class="stats" aria-label="スコア">
        <div class="stat">
          <span class="stat-label">手数</span>
          <strong id="moves">0</strong>
        </div>
        <div class="stat">
          <span class="stat-label">発見</span>
          <strong><span id="matches">0</span>/8</strong>
        </div>
        <div class="stat">
          <span class="stat-label">時間</span>
          <strong id="timer">00:00</strong>
        </div>
      </section>

      <section class="board-wrap" aria-label="カードボード">
        <div class="board" id="board"></div>
      </section>

      <section class="result" id="result" aria-live="polite" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="result-header">
          <p class="result-kicker">Perfect Match</p>
          <p class="result-title">クリア！</p>
          <p id="resultText"></p>
        </div>
        <div class="gallery" aria-label="使用した画像">
          <div class="gallery-stage">
            <button class="gallery-nav" id="prevImageButton" type="button" aria-label="前の画像">‹</button>
            <img id="galleryImage" src="" alt="使用した画像" />
            <button class="gallery-nav" id="nextImageButton" type="button" aria-label="次の画像">›</button>
          </div>
          <p class="gallery-count" id="galleryCount"></p>
          <div class="gallery-thumbs" id="galleryThumbs"></div>
        </div>
        <button class="primary-button" id="playAgainButton" type="button">もう一度</button>
      </section>

      <section class="pause-overlay" id="pauseOverlay" aria-live="polite" hidden>
        <p class="pause-title">一時停止中</p>
        <button class="primary-button" id="resumeButton" type="button">再開</button>
      </section>
    </main>

    <script src="script.js?v=20260428-refresh-2"></script>
  </body>
</html>
